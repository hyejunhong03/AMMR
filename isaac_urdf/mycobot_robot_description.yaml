# Lula robot description for the myCobot 280 M5 with the adaptive gripper.
#
# Pairs with isaac_urdf/mycobot_280_m5_adaptive_gripper.urdf and is loaded by
# LulaKinematicsSolver for inverse kinematics in scripts/ammr_ik.py.
#
# The URDF names the links joint1..joint6 and the joints <child>_to_<parent>, so the
# cspace entries below are joint names while an IK end-effector frame is a link name
# (gripper_base).

api_version: 1.0

# Must match ARM_JOINTS in scripts/ammr_mycobot_interface.py exactly, and in this order:
# the solver returns a vector in this order and it is published straight onto
# /ammr/arm/joint_targets with the gripper appended as the seventh element.
cspace:
    - joint2_to_joint1
    - joint3_to_joint2
    - joint4_to_joint3
    - joint5_to_joint4
    - joint6_to_joint5
    - joint6output_to_joint6

# The verified p1 pre-grasp configuration. IK has multiple solutions and some wrist
# branches are unstable here -- an earlier hand-measured pose let joint5/joint6 jump
# about 0.29 rad once the gripper closed. Seeding from a configuration known to hold
# keeps the solver in that branch.
default_q: [
    0.05926, -0.88532, -0.01444, -0.56180, 0.00116, 0.10097
]

acceleration_limits: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
jerk_limits: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0]

# Every cspace coordinate maps directly to a URDF joint, so no overrides are needed.
cspace_to_urdf_rules: []

# Collision spheres are omitted on purpose. LulaKinematicsSolver reports
# supports_collision_avoidance() == False unconditionally, so they buy nothing for the
# IK use here. Add them only if this description is later reused for RmpFlow.
collision_spheres: []
